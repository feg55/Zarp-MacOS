# XcodeGen spec for the Zarp macOS app. Generate the Xcode project with:
#   xcodegen generate
# then open Zarp.xcodeproj (or `xcodebuild -project Zarp.xcodeproj -scheme Zarp build`).
# Zarp.xcodeproj is generated and git-ignored: this file is the source of truth.
#
# One plain app target — no entitlements, no System Extension — that talks to the separate `zarpd`
# daemon (its own Go module, zarpd/) over a Unix domain socket (docs/ARCHITECTURE.md §5). The daemon
# is built from source and embedded into the app bundle (Contents/MacOS/zarpd plus its LaunchDaemon
# plist) by the script phase below, and registered with SMAppService at runtime (ZarpdInstaller.swift).
# It is a Go binary, not an Xcode target, which is why a script phase builds it.
#
# Signing: your Team ID is not in this file. Copy Config/Local.xcconfig.example to
# Config/Local.xcconfig (git-ignored) and set DEVELOPMENT_TEAM there; see docs/DEVELOPMENT.md.
name: Zarp
options:
  bundleIdPrefix: io.github.zarp
  deploymentTarget:
    macOS: "14.0"

packages:
  ZarpCore:
    path: Packages/ZarpCore

targets:
  Zarp:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Zarp.xcconfig
      Release: Config/Zarp.xcconfig
    sources:
      - path: App/Sources/Zarp
      - path: Resources/Lang
        buildPhase: resources
        type: folder
      - path: Resources/blobs
        buildPhase: resources
        type: folder
      # LICENSE, THIRD_PARTY_NOTICES.md and the license texts that must accompany the distributed
      # binaries (the Go components inside zarpd, the zapret2 blobs) — Settings' "Licenses" button
      # copies this folder out and reveals it. Regenerate with scripts/gen-notices.sh.
      - path: Resources/Licenses
        buildPhase: resources
        type: folder
    dependencies:
      - package: ZarpCore
      - package: ZarpCore
        product: ZarpdIPC
    postCompileScripts:
      - name: "Build and embed zarpd daemon"
        # `basedOnDependencyAnalysis: false` — always run, since we don't declare explicit
        # input/output file lists (zarpd's own Go build has its own, real incremental caching via
        # the Go build cache, so this script re-running every time costs a fast no-op `go build`
        # call, not a full recompile).
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Xcode runs script phases with a minimal PATH: add the usual Go locations (Homebrew on
          # Apple Silicon and Intel, and the official installer's /usr/local/go).
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:$PATH"
          command -v go >/dev/null || { echo "error: Go is not installed (brew install go)" >&2; exit 1; }

          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${DEST}/MacOS" "${DEST}/Library/LaunchDaemons"

          # arm64 only, matching ARCHS below — `go build` otherwise builds for whatever the host
          # is, which would silently ship a daemon that doesn't match a universal app. The cgo
          # objects (runtime/cgo, net's resolver) are compiled by clang with the *host* SDK's
          # default deployment target unless told otherwise, which is what produced the
          # "built for newer macOS (15.0) than being linked (14.0)" linker warnings; pinning both
          # flags to the app's own deployment target makes the daemon's declared minimum honest.
          export GOOS=darwin GOARCH=arm64 CGO_ENABLED=1
          export CGO_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          export CGO_LDFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"

          cd "${SRCROOT}/zarpd"

          # The daemon's embedded Info.plist carries the app's version (a copy is stamped here so
          # the checked-in template never has to be edited), and the same version is compiled in as
          # main.version — the app compares it with its own to notice a stale daemon left running
          # after an app update.
          INFO_PLIST="${DERIVED_FILE_DIR}/zarpd-Info.plist"
          mkdir -p "${DERIVED_FILE_DIR}"
          cp "${SRCROOT}/zarpd/cmd/zarpd/Info.plist" "${INFO_PLIST}"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${MARKETING_VERSION}" \
            -c "Set :CFBundleVersion ${CURRENT_PROJECT_VERSION}" "${INFO_PLIST}"

          # The extldflags value is single-quoted so a build path containing spaces stays one
          # argument; -trimpath keeps the builder's directories out of the binary.
          go build -trimpath \
            -ldflags="-linkmode external -extldflags '-Wl,-sectcreate,__TEXT,__info_plist,${INFO_PLIST}' -X main.version=${MARKETING_VERSION}" \
            -o "${DEST}/MacOS/zarpd" ./cmd/zarpd

          cp "${SRCROOT}/zarpd/cmd/zarpd/io.github.zarp.mac.zarpd.plist" "${DEST}/Library/LaunchDaemons/"

          # Same identity Xcode is about to sign the app itself with — SMAppService requires the
          # daemon and the app to share a Team ID (docs/ARCHITECTURE.md §7).
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          codesign --force --sign "${IDENTITY}" --timestamp=none "${DEST}/MacOS/zarpd"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zarp.mac
        PRODUCT_NAME: Zarp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # Apple Silicon only (docs/ARCHITECTURE.md §1): the embedded zarpd
        # Go binary is arm64-only, so a universal app would ship an x86_64 slice with nothing to
        # talk to. Also keeps a Release build from silently becoming universal.
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        # Plain app, no entitlements: Zarp needs no Apple capability at all, so a free Personal Team
        # signs it fine. DEVELOPMENT_TEAM comes from Config/Local.xcconfig.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Zarp-Info.plist
      properties:
        CFBundleDisplayName: Zarp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Shows in the Dock *and* the menu bar (MenuBarExtra), matching Windows Zarp's taskbar +
        # tray presence. Flip to true only if Zarp should become menu-bar-only.
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 feg55. MIT License. Zarp is an independent project, not affiliated with or endorsed by Cloudflare."

  ZarpCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/ZarpCore/Tests/ZarpCoreTests
    dependencies:
      - package: ZarpCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    # Also runnable without Xcode: `cd Packages/ZarpCore && swift test` (docs/DEVELOPMENT.md).

  # The client for zarpd's socket, tested against a fake daemon (no GUI, no root, no network).
  ZarpdIPCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/ZarpCore/Tests/ZarpdIPCTests
    dependencies:
      - package: ZarpCore
      - package: ZarpCore
        product: ZarpdIPC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Zarp:
    build:
      targets:
        Zarp: all
        ZarpCoreTests: [test]
        ZarpdIPCTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZarpCoreTests
        - ZarpdIPCTests
