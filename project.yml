# XcodeGen spec for the Zarp macOS app. Generate the Xcode project with:
#   xcodegen generate
# then open Zarp.xcodeproj.
#
# UNVERIFIED: written without Xcode or a macOS machine available (see
# docs/IMPLEMENTATION_PLAN.md) — `xcodegen generate` has never been run against this file. It
# covers only the plain app target described in docs/ARCHITECTURE.md §2–§5 (UI + ZarpCore).
# It deliberately does NOT define a system extension, a LaunchDaemon helper target, entitlements,
# or a Network Extension capability — see docs/MACOS_NETWORK_RESEARCH.md and
# docs/IMPLEMENTATION_PLAN.md phase 1 for why those wait for the real-Mac proof of concept.
#
# Particularly likely to need a fix once this is actually generated:
#  - Whether `resources:` with `type: folder` is really the right way to get a folder reference
#    (as opposed to a flattened group) for Resources/Lang, so that
#    `Bundle.main.resourceURL?.appendingPathComponent("Lang")` in ZarpApp.swift finds it. See that
#    file's doc comment for the fallback path this relies on until it's confirmed.
name: Zarp
options:
  bundleIdPrefix: io.github.zarp
  deploymentTarget:
    macOS: "14.0"

packages:
  ZarpCore:
    path: Packages/ZarpCore

targets:
  Zarp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/Zarp
    resources:
      - path: Resources/Lang
        type: folder
      - path: Resources/blobs
        type: folder
    dependencies:
      - package: ZarpCore
      - target: ZarpFilter
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zarp.mac
        PRODUCT_NAME: Zarp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        # Ad-hoc, not the free Personal Team: Network Extensions/System Extension aren't available
        # to a Personal Team at all (confirmed directly by Apple's provisioning server — see
        # docs/MACOS_NETWORK_RESEARCH.md). Xcode's own signing phase won't ad-hoc-sign a target
        # with capability-requiring entitlements even with CODE_SIGN_IDENTITY=-, so signing is
        # done manually after the build (see tools/poc-run.sh) instead of through xcodebuild.
        # Only works with SIP off + `systemextensionsctl developer on`, for local PoC testing —
        # not how this app will ultimately ship.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: App/Zarp.entitlements
    info:
      path: Generated/Zarp-Info.plist
      properties:
        CFBundleDisplayName: Zarp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Shows in the Dock *and* the menu bar (MenuBarExtra), matching Windows Zarp's taskbar +
        # tray presence. Flip to true only if Zarp should become menu-bar-only.
        LSUIElement: false
        NSHumanReadableCopyright: "Zarp is an independent project, not affiliated with or endorsed by Cloudflare."

  ZarpFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: PoC/Filter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zarp.mac.filter
        PRODUCT_NAME: ZarpFilter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: PoC/Filter/ZarpFilter.entitlements
        SKIP_INSTALL: YES
    info:
      path: Generated/ZarpFilter-Info.plist
      properties:
        CFBundleDisplayName: Zarp Filter
        NSSystemExtensionUsageDescription: "Zarp uses this system extension to observe, and later briefly delay, the first packet of a new Cloudflare WARP connection so DPI-evading strategies can be tested. It does not read or forward unrelated network traffic."
        NetworkExtension:
          NEMachServiceName: "$(TeamIdentifierPrefix)io.github.zarp.mac.filter"
          NEProviderClasses:
            com.apple.networkextension.filter-packet: $(PRODUCT_MODULE_NAME).FilterPacketProvider

  ZarpCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/ZarpCore/Tests/ZarpCoreTests
    dependencies:
      - package: ZarpCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    # Also runnable without Xcode: `cd Packages/ZarpCore && swift test` (see docs/IMPLEMENTATION_PLAN.md).

schemes:
  Zarp:
    build:
      targets:
        Zarp: all
        ZarpCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZarpCoreTests
