# XcodeGen spec for the Zarp macOS app. Generate the Xcode project with:
#   xcodegen generate
# then open Zarp.xcodeproj (or `xcodebuild -project Zarp.xcodeproj -scheme Zarp build`).
#
# A single plain app target (ARCHITECTURE.md §2-§6), no entitlements, no System Extension. Zarp
# talks to the separate `zarpd` daemon (its own Go module) over a Unix domain socket
# (ARCHITECTURE.md §9.4). As of Phase 8, `zarpd` is built from source and embedded into this app's
# own bundle (Contents/MacOS/zarpd + Contents/Library/LaunchDaemons/*.plist) by the postCompileScripts
# phase below, and installed via SMAppService.daemon (ZarpdInstaller.swift) — no manual `sudo zarpd`
# needed once installed. No separate Xcode target for it: it's a Go binary, not Swift/ObjC, so a
# script phase (not an Xcode target) builds and embeds it.
name: Zarp
options:
  bundleIdPrefix: io.github.zarp
  deploymentTarget:
    macOS: "14.0"

packages:
  ZarpCore:
    path: Packages/ZarpCore

targets:
  Zarp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/Zarp
      - path: Resources/Lang
        buildPhase: resources
        type: folder
      - path: Resources/blobs
        buildPhase: resources
        type: folder
    dependencies:
      - package: ZarpCore
    postCompileScripts:
      - name: "Build and embed zarpd daemon"
        # `basedOnDependencyAnalysis: false` — always run, since we don't declare explicit
        # input/output file lists (zarpd's own Go build has its own, real incremental caching via
        # the Go build cache, so this script re-running every time costs a fast no-op `go build`
        # call, not a full recompile).
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${DEST}/MacOS" "${DEST}/Library/LaunchDaemons"

          # arm64 only, matching ARCHS below — `go build` otherwise builds for whatever the host
          # is, which would silently ship a daemon that doesn't match a universal app. The cgo
          # objects (runtime/cgo, net's resolver) are compiled by clang with the *host* SDK's
          # default deployment target unless told otherwise, which is what produced the
          # "built for newer macOS (15.0) than being linked (14.0)" linker warnings; pinning both
          # flags to the app's own deployment target makes the daemon's declared minimum honest.
          export GOOS=darwin GOARCH=arm64 CGO_ENABLED=1
          export CGO_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          export CGO_LDFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"

          cd "${SRCROOT}/zarpd"
          INFO_PLIST="${SRCROOT}/zarpd/cmd/zarpd/Info.plist"
          go build -ldflags="-linkmode external -extldflags -Wl,-sectcreate,__TEXT,__info_plist,${INFO_PLIST}" \
            -o "${DEST}/MacOS/zarpd" ./cmd/zarpd

          cp "${SRCROOT}/zarpd/cmd/zarpd/io.github.zarp.mac.zarpd.plist" "${DEST}/Library/LaunchDaemons/"

          # Same identity Xcode is about to sign the app itself with — SMAppService requires the
          # daemon and the app to share a Team ID (ARCHITECTURE.md's Phase 8 notes).
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          codesign --force --sign "${IDENTITY}" --timestamp=none "${DEST}/MacOS/zarpd"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zarp.mac
        PRODUCT_NAME: Zarp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # Apple Silicon only (this port's whole premise, ARCHITECTURE.md §1): the embedded zarpd
        # Go binary is arm64-only, so a universal app would ship an x86_64 slice with nothing to
        # talk to. Also keeps a Release build from silently becoming universal.
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        # Plain app, no entitlements needed — the architecture pivot (ARCHITECTURE.md §9-10) means
        # Zarp no longer needs any Apple capability at all, System Extension or otherwise. A free
        # Personal Team signs this fine (confirmed: phases 1-3 built and ran this way before the
        # since-removed NetworkExtension experiment added entitlements this target no longer has).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G86X3LK72R
    info:
      path: Generated/Zarp-Info.plist
      properties:
        CFBundleDisplayName: Zarp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Shows in the Dock *and* the menu bar (MenuBarExtra), matching Windows Zarp's taskbar +
        # tray presence. Flip to true only if Zarp should become menu-bar-only.
        LSUIElement: false
        NSHumanReadableCopyright: "Zarp is an independent project, not affiliated with or endorsed by Cloudflare."

  # ZarpFilter (NEFilterPacketProvider) was removed from the build entirely — the architecture
  # pivot (ARCHITECTURE.md §10) rejected that approach. Its source is kept at PoC/Filter/ as a
  # record, per that section, but is no longer part of what this file builds.

  ZarpCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/ZarpCore/Tests/ZarpCoreTests
    dependencies:
      - package: ZarpCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    # Also runnable without Xcode: `cd Packages/ZarpCore && swift test` (see docs/IMPLEMENTATION_PLAN.md).

schemes:
  Zarp:
    build:
      targets:
        Zarp: all
        ZarpCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZarpCoreTests
