name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the use case, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Zarp to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: markdown
    attributes:
      value: |
        Zarp is a spare-time project, so please keep in mind that the daemon runs as root and changes routes and DNS: changes in that area are made carefully and tested on a real network.
